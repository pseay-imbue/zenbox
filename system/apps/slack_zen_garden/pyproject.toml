[project]
name = "slack-zen-garden"
version = "0.1.0"
description = "3D zen-garden web view of unread Slack messages as aging potted plants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
slack-zen-garden = "slack_zen_garden.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_zen_garden"]
